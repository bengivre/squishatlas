services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://squishmallow:${POSTGRES_PASSWORD}@db:5432/squishmallow
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SMTP_HOST: ${SMTP_HOST:-mail.bmail.im}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-no-reply@squishatlas.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      UPLOADS_DIR: /data/uploads
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD}
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://squishmallow:${POSTGRES_PASSWORD}@db:5432/squishmallow
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD}
    restart: "no"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: squishmallow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: squishmallow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squishmallow -d squishmallow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-}
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile.base:ro
      - ./docker/caddy/entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - uploads:/data/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: squishmallow
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: squishmallow
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    volumes:
      - uploads:/data/uploads:ro
      - backups:/backups
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
